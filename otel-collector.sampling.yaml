receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  tail_sampling:
    decision_wait: 2s
    num_traces: 128
    expected_new_traces_per_sec: 100
    decision_cache:
      sampled_cache_size: 2048
      non_sampled_cache_size: 2048
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 100
      - name: normal-subset
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
          hash_salt: traceforge-session13
exporters:
  otlp/traceforge:
    endpoint: traceforge-server:4319
    tls:
      insecure: true
    timeout: 6s
    sending_queue:
      queue_size: 32
      num_consumers: 1
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling]
      exporters: [otlp/traceforge]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp/traceforge]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp/traceforge]
